<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<!-- 
    fieldset -> Se utiliza para agrupar elementos dentro de un formulario.

    legend -> Representa una etiqueta para el contenido del fieldset.

    file -> Este input se utiliza para cargar archivo y enviarlos desde un formulario.

    meter -> Representa un valor dentro de un rango conocido.
    
    progress -> Representa el progreso de una tarea.

    textarea -> Se utiliza para introducir texto en un formulario.
 -->
<body>
    <header></header>
    <nav></nav>
    <main>
        <form action="">
            <fieldset>
                <legend>Datos personales</legend>
                <div>
                    <label for="name">Nombre</label>
                    <input type="text" id="name">
                </div>
                <div>
                    <label for="lastname">Apellido</label>
                    <input type="text" id="lastname">
                </div>
            </fieldset>
            <input type="file">
            <div>
                <label for="fuel">Combustible</label>
                <meter id="fuel" min="0" max="100" value="60" low="30" high="75" optimum="50"></meter>
            </div>
            <div>
                <label for="task">Tarea #1</label>
                <progress id="task" max="100" value="10"></progress>
            </div>
            <div>
                <label for="message">Mensaje</label>
                <div>
                    <textarea name="" id="message" cols="30" rows="10"></textarea>
                </div>
            </div>
        </form>
    </main>
    <aside></aside>
    <footer></footer>
</body>
</html>
