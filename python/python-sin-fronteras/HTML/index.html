<!DOCTYPE html>
<head>
    <title>Contacto</title>
</head>

        <legend> Datos de contacto </legend>
        <form action="contacto.html">
            <label>Nombre</label>
            <input type="text">
            <label for="">Apellido</label>
            <input type="text">
            <br>
            <label for="">Correo</label>
            <input type="email">
            <br>
            <label for="">Comentarios</label>

            <button>Aceptar</button>
        </form>
    </fieldset>
</body>
</html>
